; Install as <Grand Theft Auto V>\Scripts\PacePartners.ini

[MAIN]
Enabled=true
AutoStart=true
ToggleKey=F10
ReloadKey=F11

[PACING]
; Female loads Beginner 1.5, Intermediate 2.6 and Expert 3.7 W/kg.
; Male loads Beginner 1.9, Intermediate 3.0 and Expert 4.1 W/kg.
PacingGender=Female
; Optional additional riders. Use hh:mm:ss or numeric minutes, comma-separated.
TargetCompletionTimes=
; Rider power uses GTBikeVConfig.ini [user] UserWeightKg; live changes are detected.
BikeMassKg=6.9
DragAreaSquareMeters=0.32
; Slow, deterministic variation around nominal power (0.018 = at most 1.8%).
PowerVariationFraction=0.018
PrimaryVariationPeriodSeconds=53
SecondaryVariationPeriodSeconds=89

[SPAWN]
; Appearance follows PacingGender and pace level automatically.
; Beginner: casual + Cruiser; Intermediate: fitness + Scorcher; Expert: race kit + TriBike3.
; 0 is invisible and 255 is opaque.
Opacity=180

[ROUTE]
; GTBike V's default physical-altitude to GTA-Z scale.
ElevationScale=0.5
SampleSpacingMeters=2
GradientWindowMeters=25
CurvatureWindowMeters=12
StraightnessWindowMeters=25
CornerLookAheadSeconds=6
MaxBrakingMps2=2.5
MaxAccelerationMps2=0.8
SurfaceSampleSpacingMeters=8
SurfaceSampleIntervalMs=150
